<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" fill="none">
  <!-- Background -->
  <rect width="1200" height="480" fill="#0f0f0f"/>

  <!-- Subtle grid -->
  <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.15" stroke-opacity="0.06"/>
  </pattern>
  <rect width="1200" height="480" fill="url(#grid)"/>

  <!-- Red accent bar top -->
  <rect x="0" y="0" width="1200" height="5" fill="#CC0000"/>

  <!-- Left: Big bold title text -->
  <text x="72" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="900" fill="#CC0000" letter-spacing="-2">AI</text>
  <text x="72" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="900" fill="#ffffff" letter-spacing="-2">POWERED</text>
  <text x="72" y="380" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1" opacity="0.85">PM</text>

  <!-- Presenter tag bottom-left -->
  <text x="72" y="444" font-family="system-ui, sans-serif" font-size="13" font-weight="500" fill="#999999" letter-spacing="1.5">AAKASH GUPTA · BERKELEY PRODUCTCON</text>

  <!-- Right: Six pillars -->
  <g transform="translate(680, 60)">

    <!-- Pillar 1 -->
    <rect x="0" y="0" width="460" height="56" rx="8" fill="#1a1a1a" stroke="#CC0000" stroke-width="1.2"/>
    <rect x="0" y="0" width="4" height="56" rx="2" fill="#CC0000"/>
    <text x="22" y="24" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#CC0000" letter-spacing="2">01</text>
    <text x="22" y="42" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Prompting</text>
    <text x="420" y="33" font-family="system-ui, sans-serif" font-size="11" fill="#666666" text-anchor="end">Frameworks · Libraries · Voice</text>

    <!-- Pillar 2 -->
    <rect x="0" y="68" width="460" height="56" rx="8" fill="#1a1a1a" stroke="#444" stroke-width="0.8"/>
    <rect x="0" y="68" width="4" height="56" rx="2" fill="#CC0000" opacity="0.7"/>
    <text x="22" y="92" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#CC0000" letter-spacing="2">02</text>
    <text x="22" y="110" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">AI Copilot</text>
    <text x="420" y="101" font-family="system-ui, sans-serif" font-size="11" fill="#666666" text-anchor="end">Claude · Cluely · NotebookLM</text>

    <!-- Pillar 3 -->
    <rect x="0" y="136" width="460" height="56" rx="8" fill="#1a1a1a" stroke="#444" stroke-width="0.8"/>
    <rect x="0" y="136" width="4" height="56" rx="2" fill="#CC0000" opacity="0.7"/>
    <text x="22" y="160" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#CC0000" letter-spacing="2">03</text>
    <text x="22" y="178" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">AI Agents</text>
    <text x="420" y="169" font-family="system-ui, sans-serif" font-size="11" fill="#666666" text-anchor="end">ChatGPT · Lindy · Claude Code</text>

    <!-- Pillar 4 -->
    <rect x="0" y="204" width="460" height="56" rx="8" fill="#1a1a1a" stroke="#444" stroke-width="0.8"/>
    <rect x="0" y="204" width="4" height="56" rx="2" fill="#CC0000" opacity="0.7"/>
    <text x="22" y="228" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#CC0000" letter-spacing="2">04</text>
    <text x="22" y="246" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">AI Prototyping</text>
    <text x="420" y="237" font-family="system-ui, sans-serif" font-size="11" fill="#666666" text-anchor="end">v0 · Bolt · Lovable · Base44</text>

    <!-- Pillar 5 -->
    <rect x="0" y="272" width="460" height="56" rx="8" fill="#1a1a1a" stroke="#444" stroke-width="0.8"/>
    <rect x="0" y="272" width="4" height="56" rx="2" fill="#CC0000" opacity="0.7"/>
    <text x="22" y="296" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#CC0000" letter-spacing="2">05</text>
    <text x="22" y="314" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">AI Discovery</text>
    <text x="420" y="305" font-family="system-ui, sans-serif" font-size="11" fill="#666666" text-anchor="end">Enterpret · Dovetail · NotebookLM</text>

    <!-- Pillar 6 -->
    <rect x="0" y="340" width="460" height="56" rx="8" fill="#1a1a1a" stroke="#444" stroke-width="0.8"/>
    <rect x="0" y="340" width="4" height="56" rx="2" fill="#CC0000" opacity="0.7"/>
    <text x="22" y="364" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#CC0000" letter-spacing="2">06</text>
    <text x="22" y="382" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">AI Analysis</text>
    <text x="420" y="373" font-family="system-ui, sans-serif" font-size="11" fill="#666666" text-anchor="end">Evals · Observability · Experiments</text>

  </g>

</svg>
